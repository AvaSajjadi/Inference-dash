# fly.toml app configuration file generated for inference-dash on 2026-06-08T22:45:59Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'inference-dash'
primary_region = 'iad'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 2048
